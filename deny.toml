# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run locally with `cargo deny check`; CI runs the same command.

[graph]
all-features = true

[advisories]
# RustSec advisories. cargo-audit already runs weekly; this makes it part of
# every PR as well.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# The satkit crate is MIT OR Apache-2.0; every dependency must be usable under
# a permissive licence so that wheels and conda packages carry no copyleft.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",   # webpki-roots: Mozilla's CA bundle
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
