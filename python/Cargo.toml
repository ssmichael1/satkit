[package]
name = "satkit-python"
version = "0.20.4"
edition = "2021"
publish = false

[lib]
name = "satkit"
crate-type = ["cdylib"]

[dependencies]
satkit = { path = "..", features = ["download"] }
pyo3 = { version = "0.29", features = ["extension-module", "anyhow"] }
numpy = "0.29"
numeris = { version = "0.5.14", features = ["serde", "ode"] }
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde-pickle = "1.2.0"
process_path = "0.1.4"

[build-dependencies]
pyo3-build-config = "0.29"
