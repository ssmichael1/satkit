# Keeps the GitHub Actions pins in .github/workflows and the composite actions
# in .github/actions current. One grouped PR a month; the workflows pin major
# tags, so this mostly catches major bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
