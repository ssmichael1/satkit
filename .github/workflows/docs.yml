name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Satkit data
        uses: ./.github/actions/satkit-data
        with:
          testvecs: "false"

      # Only when the cached copy is over a week old (the script makes no
      # request inside that window and a conditional GET outside it): the
      # IERS EOP file, finals2000A.all, carries about a year of predictions,
      # so a week-old table still covers "now" without an extrapolation
      # warning. With --all-eop-sources the CelesTrak CSV, kept only for its
      # historical rows, is fetched only if missing.
      - name: Refresh EOP and space weather (if the cached copy is over a week old)
        run: |
          pip install requests
          python python/test/download_data.py astro-data --refresh-only --max-age-hours 168 --all-eop-sources

      - name: Install system dependencies for cartopy
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev libproj-dev proj-data

      - name: Install satkit
        run: pip install -e .

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate static plots
        env:
          SATKIT_DATA: ${{ github.workspace }}/astro-data
          SATKIT_QUIET: "1"
        run: python docs/examples/gen_plots.py

      - name: Build docs
        env:
          SATKIT_DATA: ${{ github.workspace }}/astro-data
          SATKIT_QUIET: "1"
        run: mkdocs build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
