name: Scheduled Audit

# RustSec advisories are published on their own schedule, not ours — a quiet
# repo can accumulate advisories with no push to trigger the build-time
# check. This weekly run catches those. (Push/PR-time advisory checks are the
# cargo-deny `deny` job in build.yml.) The same weekly run also exercises the
# property tests at a high case count (`deep-proptest` below).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies (RustSec advisories)
        run: cargo audit

  # Deep property-test run. `cargo test` runs the proptest suites at a
  # few hundred cases per property so every push stays fast; once a week,
  # run the data-independent suite (tests/properties.rs) at a much larger
  # count to hunt for rarer counterexamples. A failure here prints a
  # minimal counterexample: pin it as a named `regression_*` test.
  deep-proptest:
    name: property tests (deep, scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Property tests, 100000 cases each
        env:
          PROPTEST_CASES: "100000"
        run: cargo test --test properties
