name: Scheduled Audit

# RustSec advisories are published on their own schedule, not ours — a quiet
# repo can accumulate advisories with no push to trigger the build-time
# check. This weekly run catches those. (Push/PR-time advisory checks are the
# cargo-deny `deny` job in build.yml.) The same weekly run also exercises the
# property tests at a high case count (`deep-proptest` below).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies (RustSec advisories)
        run: cargo audit

  # Deep property-test runs. On pushes and PRs the property suites run a
  # few hundred cases per property from a fixed seed (build.yml), so a PR's
  # result never depends on the draw. Once a week they run here, randomly
  # seeded and far deeper, to hunt for rarer counterexamples. A failure
  # prints the minimal counterexample (proptest) or a reproduce blob
  # (hypothesis): pin it as a named `regression_*` test in the Rust suite, or
  # an `@example` on the hypothesis property, with the fix.
  deep-proptest:
    name: Rust property tests (deep, scheduled)
    runs-on: ubuntu-latest
    env:
      SATKIT_DATA: astro-data
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
      # For tests/properties_data.rs (EOP); without it every test there skips.
      - name: Satkit data
        uses: ./.github/actions/satkit-data
        with:
          testvecs: "false"
      # About a minute: the TLE parser fuzz and the time properties dominate.
      - name: Data-independent properties, 1,000,000 cases each
        env:
          PROPTEST_CASES: "1000000"
        run: cargo test --test properties
      # The full IERS 2010 reduction is ~1000x costlier per case.
      - name: EOP and frame properties, 20,000 cases each
        env:
          PROPTEST_CASES: "20000"
        run: cargo test --test properties_data

  deep-hypothesis:
    name: Python property tests (deep, scheduled)
    runs-on: ubuntu-latest
    env:
      SATKIT_DATA: astro-data
      SATKIT_TESTVEC_ROOT: satkit-testvecs
      # Random draws (the "ci" profile used on PRs is derandomized)
      HYPOTHESIS_PROFILE: deep
      HYPOTHESIS_MAX_EXAMPLES: "5000"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Satkit data
        uses: ./.github/actions/satkit-data
        with:
          testvecs: "false"
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-3.13
          save-if: false
      - name: Install satkit
        run: pip install -e ".[test]"
      - name: Hypothesis properties, 5000 examples each
        run: pytest python/test/test_properties.py
