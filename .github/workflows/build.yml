name: Build

# One run per change: pull requests build on the PR event only (no
# duplicate run for the branch push), main builds on the squash commit,
# and a new push to a PR cancels the superseded run. Docs-only changes are
# checked by docs-check.yml instead.
#
# workflow_dispatch: the release preflight requires a green push or
# workflow_dispatch run of Build on main for the tagged commit. When the
# main run was cancelled (back-to-back merges cancel each other), re-run it,
# or dispatch Build on main while main is at that commit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/*.md"
      - "LICENSE*"
      - "recipes/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - "**"
      - "!wheel**"
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/*.md"
      - "LICENSE*"
      - "recipes/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Property tests are derandomized here, so a PR's result does not depend on
  # the draw: proptest from a fixed seed, hypothesis through the "ci" profile
  # (python/test/conftest.py). The weekly audit.yml run is random and deep.
  PROPTEST_RNG_SEED: "20260926"
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # One cache per job and OS, keyed on the rustc version and Cargo.lock
      # (a toolchain bump re-saves instead of restoring stale artifacts), with
      # the workspace's own crates pruned before saving. Saved from main only:
      # a PR's cache is scoped to its ref and nobody else can restore it.
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # A dependent that turns off the default features (download, omm-xml)
      # must still build warning-free.
      - name: Clippy without default features
        run: cargo clippy -p satkit --no-default-features --all-targets -- -D warnings
      # Catches broken/ambiguous intra-doc links before they reach docs.rs.
      # --no-deps keeps it cheap (only satkit's own docs are built).
      - name: Rustdoc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p satkit --all-features

  deny:
    # cargo-deny covers the RustSec advisories the cargo-audit job used to
    # check here (the weekly audit.yml schedule still runs cargo-audit, so
    # advisories published between pushes are caught too), plus the
    # dependency licence allowlist, crate sources and duplicate versions.
    # The policy lives in deny.toml at the repository root.
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Advisories, licences, sources, bans
        run: cargo deny check

  sdist:
    # Guard against source-unbuildable sdists: a broken 0.20.0 sdist (missing
    # benches/ while Cargo.toml declared a bench target) shipped to PyPI
    # undetected because wheels and `cargo publish --dry-run` exercise
    # different artifacts. Build the sdist, then pip-install *from it* and
    # import the result.
    name: sdist installs from source
    runs-on: ubuntu-latest
    env:
      # pip builds the sdist in a temporary directory; pointing cargo's target
      # at the workspace lets the cache below carry the compiled dependencies
      # from run to run instead of compiling the crate cold every time.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # One cache per job and OS, keyed on the rustc version and Cargo.lock
      # (a toolchain bump re-saves instead of restoring stale artifacts), with
      # the workspace's own crates pruned before saving. Saved from main only:
      # a PR's cache is scoped to its ref and nobody else can restore it.
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist -o dist
      - name: Install from sdist and import
        run: |
          pip install numpy
          pip install --no-deps dist/satkit-*.tar.gz
          cd /tmp
          python -c "import satkit as sk; t = sk.time(2024, 1, 1, 12, 0, 0); q = sk.quaternion.rotz(0.5); assert abs(q.angle - 0.5) < 1e-12; print('sdist install OK:', sk.__version__, t)"

  rust:
    name: rust build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos, ubuntu, windows]

    runs-on: ${{ format('{0}-latest', matrix.os) }}

    env:
      SATKIT_DATA: astro-data
      SATKIT_TESTVEC_ROOT: satkit-testvecs

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Satkit data and test vectors
        uses: ./.github/actions/satkit-data

      # One cache per job and OS, keyed on the rustc version and Cargo.lock
      # (a toolchain bump re-saves instead of restoring stale artifacts), with
      # the workspace's own crates pruned before saving. Saved from main only:
      # a PR's cache is scoped to its ref and nobody else can restore it.
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --features chrono

      # The build without the default features (no downloader, no OMM XML)
      # must pass its own unit tests, not just compile.
      - name: Test (no default features)
        run: cargo test --no-default-features --lib

      # DE421 exercises the second JPL file layout. Its files are not in the
      # test-vector bucket yet, so the test is #[ignore]d; this step runs it
      # as soon as the restored vectors carry them, and until then says so
      # on the run summary instead of skipping silently.
      - name: DE421 end-to-end test (when its vectors are present)
        if: matrix.os == 'ubuntu'
        shell: bash
        run: |
          d="$SATKIT_TESTVEC_ROOT/jplephem"
          if [ -f "$d/lnxp1900p2053.421" ] && [ -f "$d/testpo.421" ]; then
            cargo test --features chrono --test jplephem_de421_testpo -- --ignored
          else
            echo "::warning title=DE421 test not run::jplephem/lnxp1900p2053.421 and jplephem/testpo.421 are not in the test-vector bucket; tests/jplephem_de421_testpo.rs stays ignored until they are uploaded and listed in files.json."
          fi

      # What works with NO data directory and NO network: the compiled-in
      # IERS tables and gravity models, SGP4, time, Kepler, Lambert — and a
      # missing ephemeris must be a typed error, not a hang or a download.
      - name: Test (offline, empty data directory)
        shell: bash
        env:
          SATKIT_DATA: ${{ runner.temp }}/satkit-empty-data
          SATKIT_OFFLINE: "1"
        run: |
          mkdir -p "$SATKIT_DATA"
          cargo test --features chrono --lib offline_
          cargo test --features chrono --test offline_smoke

      - name: Doc
        # Identical output on every OS; once is enough.
        if: matrix.os == 'ubuntu'
        run: cargo doc --no-deps

      # Package the crate and build it from the package, as `cargo publish`
      # does, so a file missing from the crates.io package fails the PR
      # rather than the release (release.yml's preflight repeats this on the
      # tagged commit).
      - name: Package the crate (cargo publish --dry-run)
        if: matrix.os == 'ubuntu'
        run: cargo publish --dry-run --locked

  python:
    name: python bindings test (${{ matrix.os }} ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Wheels ship for CPython 3.11-3.15 on Linux, macOS arm64 and
        # Windows. The full leg (stubtest included) is Linux 3.13; the others
        # cover the oldest and newest CPython and the other two platforms.
        include:
          - { os: ubuntu, python: "3.13", full: true }
          - { os: ubuntu, python: "3.11" }
          - { os: ubuntu, python: "3.14" }
          - { os: ubuntu, python: "3.15" }
          - { os: macos, python: "3.13" }
          - { os: windows, python: "3.13" }

    runs-on: ${{ format('{0}-latest', matrix.os) }}

    env:
      SATKIT_DATA: astro-data
      SATKIT_TESTVEC_ROOT: satkit-testvecs

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          # 3.15 is a release candidate until October 2026.
          allow-prereleases: true

      - name: Satkit data and test vectors
        uses: ./.github/actions/satkit-data

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          # The extension is built against this leg's Python. Shared by
          # name so docs-check.yml can restore the Linux 3.13 cache.
          shared-key: python-${{ matrix.python }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install satkit
        run: pip install -e ".[test]"

      # Includes test_doc_examples.py, which executes the Python examples in
      # docs/**/*.md, README.md and the docstrings (each page in a subprocess
      # with SATKIT_OFFLINE=1), and test_stub_signatures.py, which checks the
      # stub constructors stubtest has to skip.
      - name: Run Python tests
        run: pytest python/test/

      # Same offline guarantee from Python: empty data dir, downloads forbidden.
      - name: Python offline smoke test (empty data directory)
        env:
          SATKIT_DATA: ${{ runner.temp }}/satkit-empty-data
          SATKIT_OFFLINE: "1"
        run: |
          mkdir -p "$SATKIT_DATA"
          pytest python/test/test_offline.py -v

      # Verify the hand-written .pyi stubs still match the compiled bindings.
      # The wrapper registers the native submodules (satkit.sun, ...) so their
      # own stubs are checked too, and passes --ignore-positional-only /
      # --ignore-disjoint-bases, which switch off two whole PyO3-idiom
      # categories; the rest is handled by python/stubtest_allowlist.txt.
      - name: Check type stubs match bindings (stubtest)
        if: matrix.full
        run: python python/run_stubtest.py
