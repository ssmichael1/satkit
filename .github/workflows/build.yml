name: Build

# One run per change: pull requests build on the PR event only (no
# duplicate run for the branch push), main builds on the squash commit,
# and a new push to a PR cancels the superseded run.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/*.md"
      - "LICENSE*"
      - "recipes/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - "**"
      - "!wheel**"
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**/*.md"
      - "LICENSE*"
      - "recipes/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    # cargo-deny covers the RustSec advisories the cargo-audit job used to
    # check here (the weekly audit.yml schedule still runs cargo-audit, so
    # advisories published between pushes are caught too), plus the
    # dependency licence allowlist, crate sources and duplicate versions.
    # The policy lives in deny.toml at the repository root.
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Advisories, licences, sources, bans
        run: cargo deny check

  sdist:
    # Guard against source-unbuildable sdists: a broken 0.20.0 sdist (missing
    # benches/ while Cargo.toml declared a bench target) shipped to PyPI
    # undetected because wheels and `cargo publish --dry-run` exercise
    # different artifacts. Build the sdist, then pip-install *from it* and
    # import the result.
    name: sdist installs from source
    runs-on: ubuntu-latest
    env:
      # pip builds the sdist in a temporary directory; pointing cargo's target
      # at the workspace lets the cache below carry the compiled dependencies
      # from run to run instead of compiling the crate cold every time.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-sdist-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sdist-
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist -o dist
      - name: Install from sdist and import
        run: |
          pip install numpy
          pip install --no-deps dist/satkit-*.tar.gz
          cd /tmp
          python -c "import satkit as sk; t = sk.time(2024, 1, 1, 12, 0, 0); q = sk.quaternion.rotz(0.5); assert abs(q.angle - 0.5) < 1e-12; print('sdist install OK:', sk.__version__, t)"

  rust:
    name: rust build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos, ubuntu, windows]

    runs-on: ${{ format('{0}-latest', matrix.os) }}

    env:
      SATKIT_DATA: astro-data
      SATKIT_TESTVEC_ROOT: satkit-testvecs

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Satkit Data
        id: cache-satkit-data
        uses: actions/cache@v6
        with:
          path: astro-data
          enableCrossOsArchive: true
          key: satkit-data-${{ hashFiles('data/manifest.json', 'python/test/download_data.py') }}
          # On a manifest change the exact key misses; seed from the newest
          # older cache so EOP/SW survive a CelesTrak outage (the download
          # step then verifies/updates the manifest files).
          #
          # There is deliberately no per-run EOP/SW refresh here: every test
          # that touches the EOP table works from the table's own bounds
          # (python/test/test_eop.py), so a cached copy stays valid however
          # old it is, while refreshing it on each job meant ~12 full-file
          # downloads from CelesTrak per push. The docs and release workflows
          # do refresh, rate-limited, because they render "now".
          restore-keys: satkit-data-

      - name: Download Satkit Data
        if: steps.cache-satkit-data.outputs.cache-hit != 'true'
        run: |
          python -m pip install requests
          python python/test/download_data.py astro-data --all-eop-sources

      - name: Cache Satkit Test Vectors
        id: cache-satkit-testvecs
        uses: actions/cache@v6
        with:
          path: satkit-testvecs
          enableCrossOsArchive: true
          key: satkit-testvecs-cache

      - name: Download Satkit Test Vectors
        if: steps.cache-satkit-testvecs.outputs.cache-hit != 'true'
        run: |
          python -m pip install requests
          python python/test/download_testvecs.py satkit-testvecs

      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-


      - name: Test
        run: cargo test --features chrono


      # What works with NO data directory and NO network: the compiled-in
      # IERS tables and gravity models, SGP4, time, Kepler, Lambert — and a
      # missing ephemeris must be a typed error, not a hang or a download.
      - name: Test (offline, empty data directory)
        shell: bash
        env:
          SATKIT_DATA: ${{ runner.temp }}/satkit-empty-data
          SATKIT_OFFLINE: "1"
        run: |
          mkdir -p "$SATKIT_DATA"
          cargo test --features chrono --lib offline_
          cargo test --features chrono --test offline_smoke
          cargo build --no-default-features

      # Already covered by `cargo test` above; re-run with --nocapture so the
      # per-case max residual vs GMAT (tests/gmat/README.md) is visible in the log.
      - name: GMAT regression residuals
        run: cargo test --test gmat_regression -- --nocapture

      - name: Doc
        # Identical output on every OS; once is enough.
        if: matrix.os == 'ubuntu'
        run: cargo doc --no-deps

  python:
    name: python bindings test
    runs-on: ubuntu-latest

    env:
      SATKIT_DATA: astro-data
      SATKIT_TESTVEC_ROOT: satkit-testvecs

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache Satkit Data
        id: cache-satkit-data
        uses: actions/cache@v6
        with:
          path: astro-data
          enableCrossOsArchive: true
          key: satkit-data-${{ hashFiles('data/manifest.json', 'python/test/download_data.py') }}
          # On a manifest change the exact key misses; seed from the newest
          # older cache so EOP/SW survive a CelesTrak outage (the download
          # step then verifies/updates the manifest files).
          #
          # There is deliberately no per-run EOP/SW refresh here: every test
          # that touches the EOP table works from the table's own bounds
          # (python/test/test_eop.py), so a cached copy stays valid however
          # old it is, while refreshing it on each job meant ~12 full-file
          # downloads from CelesTrak per push. The docs and release workflows
          # do refresh, rate-limited, because they render "now".
          restore-keys: satkit-data-

      - name: Download Satkit Data
        if: steps.cache-satkit-data.outputs.cache-hit != 'true'
        run: |
          pip install requests
          python python/test/download_data.py astro-data --all-eop-sources

      - name: Cache Satkit Test Vectors
        id: cache-satkit-testvecs
        uses: actions/cache@v6
        with:
          path: satkit-testvecs
          enableCrossOsArchive: true
          key: satkit-testvecs-cache

      - name: Download Satkit Test Vectors
        if: steps.cache-satkit-testvecs.outputs.cache-hit != 'true'
        run: |
          pip install requests
          python python/test/download_testvecs.py satkit-testvecs

      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-python-

      - name: Install satkit
        run: pip install -e ".[test]"

      # Includes test_doc_examples.py, which executes the Python examples in
      # docs/**/*.md, README.md and the docstrings (each page in a subprocess
      # with SATKIT_OFFLINE=1), and test_stub_signatures.py, which checks the
      # stub constructors stubtest has to skip.
      - name: Run Python tests
        run: pytest python/test/

      # Same offline guarantee from Python: empty data dir, downloads forbidden.
      - name: Python offline smoke test (empty data directory)
        env:
          SATKIT_DATA: ${{ runner.temp }}/satkit-empty-data
          SATKIT_OFFLINE: "1"
        run: |
          mkdir -p "$SATKIT_DATA"
          pytest python/test/test_offline.py -v

      # Already covered above; listed per case for visibility (see tests/gmat/README.md).
      - name: GMAT regression (Python)
        run: pytest python/test/test_gmat.py -v

      # Verify the hand-written .pyi stubs still match the compiled bindings.
      # The wrapper registers the native submodules (satkit.sun, ...) so their
      # own stubs are checked too, and passes --ignore-positional-only /
      # --ignore-disjoint-bases, which switch off two whole PyO3-idiom
      # categories; the rest is handled by python/stubtest_allowlist.txt.
      - name: Check type stubs match bindings (stubtest)
        run: python python/run_stubtest.py
