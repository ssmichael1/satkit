name: Release

on:
  push:
    tags:
      - v*
    branches:
      - wheel*
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  preflight:
    # Runs for tags and for wheel* branches. On a tag it checks that the
    # version strings match and that the Build workflow passed on this exact
    # commit, so a release never re-runs the test suite here (Build already
    # did, on three platforms) and never publishes from an untested or
    # mis-versioned commit. On a wheel* branch both checks are skipped and
    # the job is a no-op gate.
    name: preflight (version + green Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the tagged commit can be checked against main
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml, pyproject.toml, and python/Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          # Root workspace crate
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "satkit") | .version')

          # Python bindings crate (publish = false, but version must still be synced)
          PY_CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "satkit-python") | .version')

          # pyproject.toml (the version shipped to PyPI)
          PYPROJECT_VERSION=$(grep -E '^version = "' pyproject.toml | head -1 | sed -E 's/version = "([^"]*)"/\1/')

          FAIL=0
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            FAIL=1
          fi
          if [ "$TAG_VERSION" != "$PY_CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match python/Cargo.toml version ($PY_CARGO_VERSION)"
            FAIL=1
          fi
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
            FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then
            echo "::error::Version strings are out of sync. Use 'cargo release <version>' (which runs the pre-release-replacements in release.toml) instead of editing files by hand."
            exit 1
          fi
          echo "All version strings match tag ($TAG_VERSION)"

      - name: Require the tagged commit to be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; release only commits that were merged to main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      - name: Require a green Build run on this commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build runs on every push to main. Wait for its run on the tagged
          # commit (it may still be going if the tag followed the merge
          # quickly) and require it to have succeeded. Only a run on main
          # counts, from a push or a manual dispatch: a pull_request run of
          # the same commit ran from the PR branch's workflow files and
          # merge ref, not from main.
          id=""; status=""; conclusion=""
          for attempt in $(seq 1 80); do
            out=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
                    --commit "$GITHUB_SHA" --branch main --limit 20 \
                    --json databaseId,status,conclusion,event \
                    -q '[.[] | select(.event == "push" or .event == "workflow_dispatch")]
                        | if length == 0 then empty else .[0] | "\(.databaseId) \(.status) \(.conclusion // "-")" end' || true)
            if [ -n "$out" ]; then
              id=${out%% *}; rest=${out#* }; status=${rest%% *}; conclusion=${rest#* }
              [ "$status" = "completed" ] && break
              echo "Build run $id is $status (attempt $attempt)"
            else
              echo "no Build run for $GITHUB_SHA yet (attempt $attempt)"
            fi
            sleep 15
          done
          if [ -z "$id" ]; then
            echo "::error::No push or workflow_dispatch Build run on main found for $GITHUB_SHA. Re-run the cancelled main run, or run Build on main via workflow_dispatch (gh workflow run build.yml --ref main) while main is at this commit."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Build run $id for $GITHUB_SHA finished with '$conclusion'; refusing to release from a commit that did not pass CI."
            exit 1
          fi
          echo "Build run $id succeeded for $GITHUB_SHA"

  publish_crate:
    name: publish to crates.io
    # Also waits for the wheels, so a wheel build failure stops both
    # registries rather than leaving a crates.io-only release.
    needs: [preflight, build_wheels]
    # Job-level guard: preflight's version checks are step-level `if`s, so on
    # a wheel* branch push it succeeds without checking anything and this job
    # would otherwise run `cargo publish` from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  build_wheels:
    name: build wheels (${{ matrix.os }} ${{ matrix.python }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        # Each CPython version is its own job (no abi3 → 5 distinct wheels),
        # so the five versions build in parallel per architecture instead of
        # one serial cibuildwheel loop per runner.
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
          - ubuntu-24.04-arm
        python:
          - cp310
          - cp311
          - cp312
          - cp313
          - cp314
        include:
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux

    runs-on: ${{ matrix.os }}

    env:
      # Compiler-level cache (sccache) backed by the GitHub Actions cache.
      # Keyed on compiler inputs, so dependency crates (nalgebra, pyo3, …)
      # are reused across runs AND across the parallel per-version jobs —
      # this is what pays back the redundant dep compilation the matrix
      # split would otherwise introduce.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Incremental artifacts are not cacheable; disabling lets sccache hit.
      CARGO_INCREMENTAL: "0"
      # Build only this job's single Python version (overrides the full
      # build list in pyproject.toml's [tool.cibuildwheel]).
      CIBW_BUILD: ${{ matrix.python }}-*
      # Linux wheels build inside the manylinux container, which shares
      # neither the host filesystem nor host env. Forward the sccache
      # config + GHA cache credentials into the container…
      CIBW_ENVIRONMENT_PASS_LINUX: >-
        RUSTC_WRAPPER
        SCCACHE_GHA_ENABLED
        CARGO_INCREMENTAL
        ACTIONS_CACHE_URL
        ACTIONS_RESULTS_URL
        ACTIONS_RUNTIME_TOKEN
      # …and install the sccache binary inside that container (the host
      # install from sccache-action isn't visible in there). Pin to a
      # version that speaks the GHA cache service v2 (ACTIONS_RESULTS_URL);
      # older sccache only knows the retired v1 (ACTIONS_CACHE_URL) and
      # aborts with "environment variable not found" on current runners.
      #
      # The tarball is checked against SHA-256 sums pinned here (the values
      # of the release's own .sha256 files for v0.15.0); bump them with the
      # version.
      CIBW_BEFORE_ALL_LINUX: >-
        case "$(uname -m)" in
        x86_64) sum=782d2b5dd7ae0a55ebe368ab258114d0928d019ac2d949ab85d5d02f3926709e ;;
        aarch64) sum=3a6a3712b49da3d263bf2d30d702de4302793016019e800bfb81c0c69401d8f8 ;;
        *) echo "no pinned sccache checksum for $(uname -m)"; exit 1 ;;
        esac &&
        curl -fsSL -o /tmp/sccache.tar.gz
        https://github.com/mozilla/sccache/releases/download/v0.15.0/sccache-v0.15.0-$(uname -m)-unknown-linux-musl.tar.gz &&
        echo "$sum  /tmp/sccache.tar.gz" | sha256sum -c - &&
        tar -xzf /tmp/sccache.tar.gz -C /tmp &&
        install -m 755 /tmp/sccache-v0.15.0-$(uname -m)-unknown-linux-musl/sccache /usr/local/bin/sccache

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Set up Rust
        if: matrix.platform != 'linux'
        uses: dtolnay/rust-toolchain@stable

      # Installs sccache on the host and, importantly, exports ACTIONS_CACHE_URL /
      # ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN into the step env so the
      # CIBW_ENVIRONMENT_PASS_LINUX forwarding above has values to pass through.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - name: sccache stats
        if: always() && matrix.platform != 'linux'
        run: sccache --show-stats

      - name: Create sdist
        if: matrix.os == 'ubuntu-latest' && matrix.python == 'cp313'
        run: |
          pip install build
          python -m build --sdist . -o wheelhouse

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*

  publish_pypi:
    name: publish to PyPI
    needs: [preflight, build_wheels]
    runs-on: ubuntu-latest
    environment: PyPiPublish
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cibw-wheels-*
          merge-multiple: true

      # Pinned to a commit: this job holds id-token: write.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
