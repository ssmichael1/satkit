# satkit-data is a noarch Python package that ships the static data files
# satkit uses at runtime, for installs that must work offline: a JPL
# planetary ephemeris, gravity-model coefficients, the IERS precession-
# nutation tables, and the leap-second list.
#
# Since satkit 0.21 this package is OPTIONAL: the IERS tables and gravity
# models are compiled into satkit itself and the ephemeris is downloaded on
# first use (SHA-256 verified against satkit's data/manifest.json). Install
# satkit-data next to satkit for air-gapped / no-network environments —
# satkit discovers `$SITE_PACKAGES/satkit_data/data` automatically as a
# read-only search location.
#
# Every source below is a GitHub release asset of the `data-v1` release on
# ssmichael1/satkit-data, i.e. exactly the bytes satkit's own manifest pins.
# The `source:` block is GENERATED from data/manifest.json by
# tools/conda_sources_from_manifest.py (`--write`; `--check` in CI) so it
# cannot drift from what satkit verifies at runtime.
#
# Ephemeris choice: the conda build ships DE421 (`lnxp1900p2053.421`, 14 MB,
# 1900–2053) rather than DE440 (102 MB, 1550–2650) to stay under
# conda-forge's 100 MB package cap. satkit picks the highest DE version it
# finds, so a user who wants DE440 runs `satkit.utils.update_datafiles()`
# once and it takes precedence. (`tools/conda_sources_from_manifest.py
# --with-de440` regenerates the block with DE440 included if that policy
# ever changes.)
#
# EOP-All.csv and SW-All.csv (Earth orientation parameters, space weather)
# are NOT bundled — CelesTrak republishes them daily and asks that its
# compiled files not be mirrored; satkit fetches them on demand.
#
# `python_min` is not defined in `context:` on purpose — it comes from
# conda-forge's global pinning (3.10 at the time of writing, which matches
# satkit's own floor), and redefining it would override the platform-specific
# exceptions in that pinning.

schema_version: 1

context:
  name: satkit-data
  # TODO(release): 0.10.0 proposed — the payload changes (msis21.parm removed,
  # sources moved to the pinned data-v1 release). Publish the PyPI satkit-data
  # 0.10.0 first (its version must exist upstream), then set this.
  version: "0.10.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # BEGIN generated by tools/conda_sources_from_manifest.py — do not edit by hand
  # data_version: data-v1
  # lnxp1900p2053.421: JPL — JPL Planetary and Lunar Ephemerides DE421 (Folkner et al. 2009); US Government work, freely redistributable
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/lnxp1900p2053.421
    sha256: 5b3f81dd0c505925055a389431fd2bc5e0ae2fd02d85db37fa4d4fe54dfb4096
    target_directory: data
  # tab5.2a.txt: IERS — IERS Conventions (2010), Technical Note 36, Table 5.2a (X series); freely redistributable
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/tab5.2a.txt
    sha256: 19549252df9eb77c8237dbf5b749de82b7fd7713a8b60b35371538cd36b6aa1d
    target_directory: data
  # tab5.2b.txt: IERS — IERS Conventions (2010), Technical Note 36, Table 5.2b (Y series); freely redistributable
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/tab5.2b.txt
    sha256: 1f17a3a6ad0b468705b3323bfe72d0320ce996798ec7cba0cdde4405d88f14d9
    target_directory: data
  # tab5.2d.txt: IERS — IERS Conventions (2010), Technical Note 36, Table 5.2d (s + XY/2 series); freely redistributable
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/tab5.2d.txt
    sha256: fe94c83e1ef6f92b15b3f007779ae70c0984c06ee45d5511b4c821ee9a0ecded
    target_directory: data
  # EGM96.gfc: ICGEM-GFZ — EGM96 (Lemoine et al. 1998, NASA GSFC/NIMA) as distributed by ICGEM; US Government work
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/EGM96.gfc
    sha256: 5247a9e9c316dd2c8f8fd491d53be0e163cb5cb3676b021754240cc9e44cb43b
    target_directory: data
  # ITU_GRACE16.gfc: ICGEM-GFZ — ITU_GRACE16 (Akyilmaz et al. 2016, GFZ Data Services doi:10.5880/icgem.2016.006), CC BY 4.0
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/ITU_GRACE16.gfc
    sha256: b6bea9c78ad168f1e206fc7211f90b64fba54325c832f4473f6c05a07adbc718
    target_directory: data
  # JGM2.gfc: ICGEM-GFZ — JGM-2 (Nerem et al. 1994, NASA GSFC / UT CSR) as distributed by ICGEM; US Government work
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/JGM2.gfc
    sha256: 0779cf74f216d5b38c7a4c4a1a25d596b659605deb7731f00874c17e9ed3f5af
    target_directory: data
  # JGM3.gfc: ICGEM-GFZ — JGM-3 (Tapley et al. 1996, NASA GSFC / UT CSR) as distributed by ICGEM; US Government work
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/JGM3.gfc
    sha256: 2ec791eec795689291974dd3602b304029da93d3fea30096daa3b368fb231d03
    target_directory: data
  # leap-seconds.list: IERS — IERS/USNO leap-second list; public data. Reference only: satkit's runtime leap-second table is compiled in
  - url: https://github.com/ssmichael1/satkit-data/releases/download/data-v1/leap-seconds.list
    sha256: 14b4faab51b1885680a704744863bda8b5728a0f0a5e07a15c8469532318b305
    target_directory: data
  # END generated

build:
  number: 0
  noarch: python
  # Lay the downloaded files out as a `satkit_data` Python package, mirroring
  # the on-PyPI sibling so satkit's `$SITE_PACKAGES/satkit_data/data`
  # search location finds them without configuration (satkit >= 0.21 accepts
  # this layout both as a regular and as a namespace package). The copy logic
  # lives in build_data.py so it runs identically on Linux/macOS/Windows (a
  # bash `cp`/`mkdir -p` script fails on the Windows agent). rattler-build
  # auto-discovers build.sh (unix) / build.bat (windows) next to this file;
  # they invoke build_data.py via $RECIPE_DIR since recipe files are not
  # copied into $SRC_DIR.

requirements:
  host:
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - satkit_data
      # The package is laid out by build_data.py rather than pip-installed,
      # so there is no dist-info metadata for `pip check` to inspect.
      pip_check: false
      # noarch: python installs on every Python >= python_min; exercise both
      # ends of that range.
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "from importlib.resources import files; d = files('satkit_data').joinpath('data'); names = sorted(p.name for p in d.iterdir()); assert 'lnxp1900p2053.421' in names, names; assert 'EGM96.gfc' in names, names; assert 'tab5.2a.txt' in names, names; assert 'msis21.parm' not in names, names; print('\n'.join(names))"

about:
  homepage: https://github.com/ssmichael1/satkit
  summary: Optional offline data bundle for satkit (JPL DE421 ephemeris, gravity models, IERS tables, leap seconds)
  description: |
    Optional companion to satkit for offline / air-gapped installs. Ships
    the static data files satkit otherwise fetches on first use, exactly as
    pinned (SHA-256) by satkit's data manifest:

      * **lnxp1900p2053.421** — JPL DE421 planetary ephemeris
        (1900–2053, 14 MB). For the longer DE440 span run
        `satkit.utils.update_datafiles()` (102 MB download).
      * **EGM96.gfc, JGM2.gfc, JGM3.gfc, ITU_GRACE16.gfc** — full-degree
        gravity models (ICGEM format; satkit itself embeds them to degree 70).
      * **tab5.2a.txt, tab5.2b.txt, tab5.2d.txt** — IERS Technical Note 36
        precession-nutation series (also embedded in satkit).
      * **leap-seconds.list** — the IERS/IETF leap-second list, for reference
        (satkit's runtime leap-second table is compiled in).

    Earth orientation parameters (EOP-All.csv) and space weather
    (SW-All.csv) are NOT bundled because CelesTrak regenerates them daily;
    satkit fetches them on demand (`satkit.utils.update_datafiles()`).
  # The packaging (the satkit_data Python wrapper + this recipe) is the only
  # copyrightable contribution here and is MIT OR Apache-2.0. The bundled data
  # files are third-party public-domain / freely-redistributable scientific
  # reference data; their provenance and individual terms are enumerated in
  # LICENSE (the attribution/NOTICE file).
  license: MIT OR Apache-2.0
  license_file: LICENSE
  documentation: https://satkit.dev/getting-started/datafiles/
  repository: https://github.com/ssmichael1/satkit

extra:
  recipe-maintainers:
    - ssmichael1
